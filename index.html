<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board Result Portal</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #e9ecef;
            margin: 0;
            padding: 0;
        }

        .header {
            background-color: #003366;
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 4px solid #ffcc00;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        .search-box {
            text-align: center;
            margin-bottom: 30px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
        }

        input[type="text"] {
            padding: 10px;
            width: 200px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .btn-go {
            padding: 10px 25px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-go:hover {
            background-color: #0056b3;
        }

        /* Marksheet Table Styling */
        #resultTable {
            display: none;
            margin-top: 20px;
        }

        .student-info {
            margin-bottom: 15px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
            color: #333;
        }

        .total-row {
            font-weight: bold;
            background-color: #fff9c4;
        }

        .result-status {
            text-align: center;
            margin-top: 20px;
            font-size: 1.2em;
            font-weight: bold;
        }

        .pass { color: green; }
    </style>
</head>
<body>

<div class="header">
    <h2>BOARD OF SECONDARY & HIGHER SECONDARY EDUCATION</h2>
</div>

<div class="container">
    <div class="search-box">
        <label>Enter Seat Number: </label>
        <input type="text" id="seatNum" placeholder="000001">
        <button class="btn-go" onclick="generateResult()">Go</button>
    </div>

    <div id="resultTable">
        <div class="student-info">
            <p><strong>Seat Number:</strong> <span id="displaySeat"></span></p>
            <p><strong>Student Name:</strong> ABC STUDENT NAME</p>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Subject Code</th>
                    <th>Subject Name</th>
                    <th>Marks</th>
                    <th>Grade</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>10</td>
                    <td>MATHEMATICS</td>
                    <td>11/50</td>
                    <td>FAIL</td>
                </tr>
            </tbody>
        </table>

        <div class="result-status">
            Result: <span class="pass" (PASS)</span>
        </div>
    </div>
</div>

<script>
    function generateResult() {
        var seat = document.getElementById('seatNum').value;
        
        if (seat.trim() === "") {
            alert("Please enter a valid Seat Number");
            return;
        }

        // સીટ નંબર બતાવવો અને ટેબલ અનહાઈડ કરવું
        document.getElementById('displaySeat').innerText = seat.toUpperCase();
        document.getElementById('resultTable').style.display = "block";
    }
</script>

</body>
</html>
